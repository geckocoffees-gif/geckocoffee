<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gecko Coffee — Café de especialidad</title>

  <meta
    name="description"
    content="Gecko Coffee — micro-tostaduría de café de especialidad en Paraguay."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->

  <header class="site-header">

 <a href="#inicio" class="logo">
  <img src="logo-gecko.png" alt="Gecko Coffee">
  <span>GECKO<span>COFFEE</span></span>
</a>
    
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#cafes">Cafés</a>
      <a href="#nosotros">Nosotros</a>
      <a href="#contacto">Contacto</a>

      <a href="#pedido" class="cart-link">
        Pedido <span id="cart-count">0</span>
      </a>
    </nav>

  </header>


  <main>


    <!-- HERO -->

 <section class="hero" id="inicio">

  <div class="hero-background">
    <img
      src="hero.jpg"
      alt="Gecko Coffee — Café de especialidad"
    >
  </div>

  <div class="hero-overlay"></div>

  <div class="hero-content">

    <h1>
      Descubrí la belleza del café.
    </h1>

    <a href="cafes.html" class="hero-button">
      Nuestros cafés
    </a>

  </div>

</section>

    
    <!-- CONTACT -->

    <section
      id="contacto"
      class="contact"
    >

      <p class="eyebrow">
        CONTACTO
      </p>

      <h2>
        ¿Querés conocer mejor nuestros cafés?
      </h2>

      <p>
        Escribinos y estaremos encantados de ayudarte
        a elegir tu próximo café.
      </p>

      <a
        class="button light"
        href="mailto:hola@geckocoffee.com.py"
      >
        Contactar
      </a>

    </section>

  </main>



  <!-- FOOTER -->

  <footer>

  <div class="logo">
  <img src="logo-gecko.png" alt="Gecko Coffee">
  <span>GECKO<span>COFFEE</span></span>
</div>

    <p>
      © 2026 Gecko Coffee · Café de especialidad
    </p>

  </footer>



  <script src="script.js"></script>

</body>
</html>
